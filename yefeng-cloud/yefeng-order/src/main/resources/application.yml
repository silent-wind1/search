server:
  port: 18080

spring:
  application:
    name: yefeng-order
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/yefeng_orders?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: root
    password: 031214t+
  cloud:
    nacos:
      discovery:
        server-addr: ${spring.cloud.nacos.discovery.server-addr}
        namespace: 20220411 # 这里的namespace 对应 nacos 命名空间的id
        cluster-name: SZ # 配置服务所属集群
      config:
        server-addr: ${spring.cloud.nacos.discovery.server-addr}
        namespace: 20220411
        file-extension: yaml
  # 注意在这里配置 Nacos配置中心的文件
  config:
    import:
      - nacos:order-service.yaml
      - nacos:common.yaml

    loadbalancer:
      nacos: # 集成nacos的负载均衡算法
        enabled: true

    openfeign:
      client:
        config:
          default:
            loggerLevel: full
            read-timeout: 2000            # 读取数据的超时时间设置为2s
            connect-timeout: 2000        # 简历连接的超时时间设置为2s
            retryer: com.yefeng.feign.retryer.FeignClientRetryer		# 配置自定义重试器

# 配置mybatis的相关信息
mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  type-aliases-package: com.yefeng.order.entity
  mapper-locations: classpath:/mapper/*.xml

# 测试配置文件和Nacos配置中心哪个权重更高，答案是Nacos配置中心
name: 12345