server:
  port: 18081

spring:
  application:
    name: yefeng-user
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/yefeng_users?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: root
    password: 031214t+

  config:
    import:
      - nacos:order-service.yaml

  cloud:
    nacos:
      discovery:
        server-addr: ${spring.cloud.nacos.discovery.server-addr}
        namespace: 20220411  # 这里的namespace 对应 nacos 命名空间的id
        cluster-name: SZ # 配置服务所属集群
      config:
        server-addr: ${spring.cloud.nacos.discovery.server-addr}
        namespace: 20220411
        file-extension: yaml

    loadbalancer:
      nacos:    # 集成nacos的负载均衡算法
        enabled: true

# 配置mybatis的相关信息
mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  type-aliases-package: com.yefeng.user.entity
  mapper-locations: classpath:/mapper/*.xml